name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows
          - name: Linux x64
            os: ubuntu-latest
            platform: linux
          - name: macOS ARM64
            os: macos-14
            platform: macos
            omp_root: /opt/homebrew/opt/libomp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 toolchain (Windows)
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-glew

      - name: Set up SSH key (Windows)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        env:
          BUILD_SECRET: ${{ secrets.BUILD_SECRET }}
        run: |
          set -e

          if [ -z "$BUILD_SECRET" ]; then
            echo "BUILD_SECRET not set; using HTTPS for dependency fetch."
            git config --global url."https://github.com/".insteadOf "git@github.com:"
            exit 0
          fi

          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$BUILD_SECRET" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null || true

      - name: Set up SSH key (Linux/macOS)
        if: matrix.platform != 'windows'
        shell: bash
        env:
          BUILD_SECRET: ${{ secrets.BUILD_SECRET }}
        run: |
          set -e

          if [ -z "$BUILD_SECRET" ]; then
            echo "BUILD_SECRET not set; using HTTPS for dependency fetch."
            git config --global url."https://github.com/".insteadOf "git@github.com:"
            exit 0
          fi

          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$BUILD_SECRET" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null || true

      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y libsdl3-dev libglew-dev ninja-build

      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -e
          brew install sdl3 glew ninja libomp

      - name: Configure (Windows)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          set -e
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -e
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -e
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DOpenMP_ROOT="${{ matrix.omp_root }}"

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          set -e
          cmake --build build

      - name: Build (Linux/macOS)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -e
          cmake --build build